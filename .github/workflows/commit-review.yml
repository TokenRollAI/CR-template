name: Commit Review

on:
  push:
    branches:
      - 'v*'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Review Commits with Claude
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          github_token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            你是一个代码审查助手。请对最新的 commit 进行简单审查。

            ## 审查信息
            - 仓库: ${{ github.repository }}
            - 分支: ${{ github.ref_name }}
            - Commit SHA: ${{ github.sha }}

            ## 审查步骤

            1. 使用 git show 查看 commit 详情和变更
            2. 检查 commit 信息是否清晰、代码变更是否合理、是否有明显问题

            ## 输出格式（简体中文）

            ## 📝 Commit 审查 - ${{ github.ref_name }}

            **Commit**: {short_sha}
            **信息**: {commit message}

            ### 变更概要
            {变更文件列表}

            ### 审查结果
            ✅/⚠️/❌ {简要评价}

            {如有问题，列出1-3个要点}

            ## 注意事项
            1. 保持简洁
            2. 只关注明显问题
            3. 使用简体中文
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)" --json-schema '{"type":"object","properties":{"conclusion":{"type":"string","enum":["PASS","WARN","FAIL"]},"summary":{"type":"string","maxLength":50}},"required":["conclusion","summary"]}'

      - name: Notify Feishu
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          # 解析结构化输出
          STRUCTURED_OUTPUT='${{ steps.review.outputs.structured_output }}'
          if [ -n "$STRUCTURED_OUTPUT" ] && [ "$STRUCTURED_OUTPUT" != "null" ]; then
            CONCLUSION=$(echo "$STRUCTURED_OUTPUT" | jq -r '.conclusion // "UNKNOWN"')
            SUMMARY=$(echo "$STRUCTURED_OUTPUT" | jq -r '.summary // "审查完成"')
          else
            CONCLUSION="UNKNOWN"
            SUMMARY="未获取到审查结果"
          fi

          # 根据结论设置样式
          case "$CONCLUSION" in
            "PASS")
              EMOJI="✅"
              TEMPLATE="green"
              ;;
            "FAIL")
              EMOJI="❌"
              TEMPLATE="red"
              ;;
            "WARN")
              EMOJI="⚠️"
              TEMPLATE="orange"
              ;;
            *)
              EMOJI="💬"
              TEMPLATE="blue"
              ;;
          esac

          if [ "$STATUS" != "success" ]; then
            EMOJI="⚠️"
            TEMPLATE="orange"
            SUMMARY="Action 执行异常"
          fi

          curl -X POST "https://open.feishu.cn/open-apis/bot/v2/hook/${{ secrets.FEISHU_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": {
                    "tag": "plain_text",
                    "content": "'"${EMOJI} Commit Review - ${CONCLUSION}"'"
                  },
                  "template": "'"${TEMPLATE}"'"
                },
                "elements": [
                  {
                    "tag": "div",
                    "fields": [
                      {
                        "is_short": true,
                        "text": {
                          "tag": "lark_md",
                          "content": "**仓库**\n${{ github.repository }}"
                        }
                      },
                      {
                        "is_short": true,
                        "text": {
                          "tag": "lark_md",
                          "content": "**分支**\n${{ github.ref_name }}"
                        }
                      }
                    ]
                  },
                  {
                    "tag": "div",
                    "text": {
                      "tag": "lark_md",
                      "content": "**Commit**: '"${SHORT_SHA}"'"
                    }
                  },
                  {
                    "tag": "div",
                    "text": {
                      "tag": "lark_md",
                      "content": "**审查结果**: '"${SUMMARY}"'"
                    }
                  },
                  {
                    "tag": "action",
                    "actions": [
                      {
                        "tag": "button",
                        "text": {
                          "tag": "plain_text",
                          "content": "查看 Commit"
                        },
                        "type": "primary",
                        "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                      }
                    ]
                  }
                ]
              }
            }'
